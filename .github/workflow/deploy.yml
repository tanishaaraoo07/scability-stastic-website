echo 'name: Deploy Static Website to Azure Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16
        
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Upload to Azure Storage
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az storage blob upload-batch --account-name mystatiwebsiteXXXX --auth-mode login --destination "$web" --source . --overwrite
          
    - name: Purge CDN cache (if using Azure CDN)
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Note: We are using Cloudflare for CDN, so no Azure CDN to purge"
          
    - name: Log deployment info
      run: |
        echo "Deployment completed on $(date)"
        echo "Website URL: https://mystatiwebsiteXXXX.z13.web.core.windows.net/"' > .github/workflows/deploy.yml